name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show the error
        if: failure()
        run: |
          echo "===== LINES WITH ERRORS ====="
          grep -n -i -E "error:|fatal|failed|traceback|no such file" build.log | tail -25
          echo "===== LAST 40 LINES ====="
          tail -n 40 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxTools-apk
          path: bin/*.apk
